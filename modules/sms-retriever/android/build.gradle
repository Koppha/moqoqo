plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.moqoqo'
version = '0.1.0'

android {
  namespace "com.moqoqo.smsretriever"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Google's SMS Retriever API: the SMS code reaches the app without any SMS permission.
  implementation 'com.google.android.gms:play-services-auth-api-phone:18.1.0'
  implementation 'androidx.core:core:1.13.1'
}
